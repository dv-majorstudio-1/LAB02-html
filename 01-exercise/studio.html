<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Super Studio Landing Page</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #e5e5e5;
        color: #111;
        padding: 24px 40px;
      }

      .subtitle {
        font-size: 0.85rem;
        font-weight: 600;
        color: #111;
      }

      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 20px;
        border-bottom: 1px solid #ccc;
      }

      .brand {
        font-size: 1.6rem;
        font-weight: 800;
        letter-spacing: -0.5px;
      }

      .locations {
        width: 80%;
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        margin-bottom: 12px;
        padding-left: 28px;
      }

      .location-item strong {
        display: block;
        font-size: 0.85rem;
        font-weight: 700;
      }

      .location-item span {
        font-size: 0.85rem;
        color: #666;
      }

      .side-text {
        font-size: 1.8rem;
        font-weight: 500;
        line-height: 1.2;
        max-width: 320px;
        letter-spacing: -0.5px;
      }

      .headline {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin: 60px 0 80px 0;
      }

      .title {
        font-size: 4rem;
        font-weight: 600;
        line-height: 1.05;
        letter-spacing: -1.5px;
      }

      .menu-label {
        font-size: 0.75rem;
        font-weight: 600;
      }

      .main-container {
        display: flex;
      }

      .showcase {
        width: 100%;
        height: 500px;
        overflow: hidden;
      }

      .showcase img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: grayscale(100%);
      }
    </style>
  </head>

  <body>
 
    <header class="top-bar">
      <div class="brand">SUPER</div>
      <div class="subtitle">Spatial Data Architecture Design</div>
      <div class="menu-label">Open Menu</div>
    </header>

    <section class="headline">
      <h1 class="title">SUPER Studio<br />Landing Page</h1>
      <div class="side-text">An agency landing page</div>
    </section>
  
    <section class="locations">
      <div class="location-item">
        <strong>Berlin</strong>
        <span>Hallo!</span>
      </div>
      <div class="location-item">
        <strong>Zurich</strong>
        <span>Grüezi!</span>
      </div>
      <div class="location-item">
        <strong>Copenhagen</strong>
        <span>Hej!</span>
      </div>
    </section>
    
    <section class="main-container">
        <div class="showcase"><img src="./imgs/super.jpg" alt="Design Space" /></div>
   </section>
    
    
    
    

  
    
    
  </body>
</html>
